name: Sync Fork

on:
  schedule:
    - cron: '0 16 * * *'  # 北京时间每天 0 点 (UTC 16:00)
  workflow_dispatch:       # 也支持手动触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync fork with upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/merge-upstream \
            --method POST \
            --field branch=master
